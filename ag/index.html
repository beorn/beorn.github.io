<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silver Code</title>
    <style>
      :root {
        color-scheme: dark;
        --case: #d9dddc;
        --case-edge: #f8f8f5;
        --case-shadow: #8d9496;
        --screen: #101311;
        --screen-deep: #050706;
        --phosphor: #d8e0e4;
        --phosphor-dim: #7f898d;
        --paper: #f7f8f4;
        --green: #8bd8d0;
        --shadow: rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.52), transparent 34%),
          linear-gradient(180deg, #eeefec 0%, #b5bbbd 100%);
        color: var(--phosphor);
        font-family:
          "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas,
          monospace;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -22%;
        z-index: 0;
        pointer-events: none;
        background:
          conic-gradient(
            from 210deg at 46% 42%,
            rgba(255, 255, 252, 0.98),
            rgba(121, 134, 138, 0.88),
            rgba(224, 245, 242, 0.78),
            rgba(72, 83, 87, 0.78),
            rgba(246, 248, 245, 0.94),
            rgba(139, 156, 158, 0.82),
            rgba(255, 255, 252, 0.98)
          ),
          radial-gradient(circle at 68% 34%, rgba(236, 255, 252, 0.8), transparent 29%),
          radial-gradient(circle at 24% 68%, rgba(63, 73, 77, 0.5), transparent 34%);
        filter: blur(22px) saturate(0.9) contrast(1.18);
        opacity: 0.92;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        animation: liquid-metal 24s ease-in-out infinite alternate;
      }

      .stage {
        position: relative;
        z-index: 1;
        width: min(100vw - 32px, 1060px);
        min-height: min(760px, calc(100vh - 48px));
        display: grid;
        place-items: center;
        padding: 28px 0;
      }

      .terminal {
        position: relative;
        width: min(100%, 980px);
        min-height: 600px;
        border-radius: 24px;
        padding: 12px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.14)),
          var(--case);
        border: 1px solid var(--case-edge);
        box-shadow:
          0 24px 72px var(--shadow),
          0 1px 0 rgba(255, 255, 255, 0.76) inset;
      }

      .terminal::before {
        display: none;
      }

      .screen {
        position: relative;
        min-height: 574px;
        border-radius: 18px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 36%, rgba(219, 228, 232, 0.08), transparent 52%),
          linear-gradient(180deg, var(--screen) 0%, var(--screen-deep) 100%);
        border: 1px solid rgba(11, 15, 13, 0.92);
        box-shadow:
          inset 0 0 64px rgba(0, 0, 0, 0.68),
          inset 0 0 18px rgba(219, 228, 232, 0.09),
          0 1px 0 rgba(255, 255, 255, 0.24);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 5px
        );
        opacity: 0.45;
        pointer-events: none;
        mix-blend-mode: screen;
      }

      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.26), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.24)),
          linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 28%, rgba(0, 0, 0, 0.24));
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        min-height: 574px;
        padding: 58px;
        display: grid;
        grid-template-rows: 1fr auto;
        text-shadow: 0 0 10px rgba(219, 228, 232, 0.14);
      }

      .topline {
        display: none;
      }

      .lockup {
        align-self: start;
        max-width: 780px;
        padding-top: 34px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 0 0 42px;
        color: var(--paper);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .ag-logo {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: auto;
        height: auto;
        border-radius: 0;
        border: 0;
        color: #fbfffe;
        -webkit-text-fill-color: #fbfffe;
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.02em;
        text-transform: none;
        transform: translateY(0);
        text-shadow:
          0 0 1px rgba(255, 255, 255, 0.95),
          0 0 5px rgba(247, 248, 244, 0.44),
          0 0 14px rgba(219, 228, 232, 0.18);
      }

      .ag-logo::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: -1;
        width: 156px;
        height: 92px;
        border-radius: 999px;
        background: radial-gradient(
          ellipse at center,
          rgba(247, 252, 251, 0.2) 0%,
          rgba(219, 238, 238, 0.13) 36%,
          rgba(139, 216, 208, 0.055) 58%,
          transparent 76%
        );
        filter: blur(8px);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      .ag-logo::after {
        display: none;
      }

      .brand-name {
        color: #ffffff;
        display: inline-flex;
        gap: 0.72em;
        letter-spacing: 0.08em;
        font-weight: 800;
        text-shadow:
          0 0 1px rgba(255, 255, 255, 0.95),
          0 0 8px rgba(247, 248, 244, 0.46),
          0 0 18px rgba(219, 228, 232, 0.3),
          0 0 30px rgba(139, 216, 208, 0.1);
        font-kerning: normal;
        text-rendering: optimizeLegibility;
      }

      h1 {
        margin: 0;
        color: var(--phosphor);
        font-size: clamp(29px, 3.55vw, 44px);
        line-height: 0.98;
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow:
          0 0 1px rgba(247, 248, 244, 0.38),
          0 0 18px rgba(219, 228, 232, 0.24);
        min-height: calc(4 * 0.98em);
      }

      .line {
        display: block;
        white-space: nowrap;
        min-height: 0.98em;
      }

      .line:nth-child(4) {
        color: var(--paper);
      }

      .footer {
        display: grid;
        align-content: start;
        justify-items: start;
        gap: 9px;
      }

      .status {
        display: none;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 14px rgba(139, 216, 208, 0.5);
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .access,
      .download {
        height: 34px;
        border-radius: 999px;
        border: 1px solid rgba(219, 228, 232, 0.48);
        background: rgba(219, 228, 232, 0.1);
        color: var(--paper);
        display: inline-flex;
        align-items: center;
        padding: 0 14px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        text-shadow:
          0 0 1px rgba(247, 248, 244, 0.42),
          0 0 12px rgba(219, 228, 232, 0.18);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition:
          background 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          color 140ms ease;
      }

      .download {
        background: rgba(139, 216, 208, 0.1);
        border-color: rgba(139, 216, 208, 0.52);
      }

      .access:hover,
      .download:hover,
      .access:focus-visible,
      .download:focus-visible {
        background: rgba(219, 228, 232, 0.22);
        border-color: rgba(247, 248, 244, 0.78);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 0 0 1px rgba(219, 228, 232, 0.08),
          0 0 28px rgba(219, 228, 232, 0.24);
        color: var(--paper);
        outline: none;
      }

      .download:hover,
      .download:focus-visible {
        background: rgba(139, 216, 208, 0.16);
        border-color: rgba(139, 216, 208, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 0 0 1px rgba(139, 216, 208, 0.1),
          0 0 28px rgba(139, 216, 208, 0.2);
      }

      .access-note {
        color: var(--phosphor-dim);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(219, 228, 232, 0.12);
      }

      .cursor {
        width: 10px;
        height: 18px;
        display: inline-block;
        background: var(--phosphor);
        box-shadow: 0 0 12px rgba(219, 228, 232, 0.38);
        animation: blink 920ms steps(1, end) infinite;
      }

      .type-cursor {
        width: 0.18em;
        height: 0.76em;
        display: inline-block;
        transform: translateY(0.08em);
        margin-left: 0.09em;
        background: var(--phosphor);
        box-shadow: 0 0 16px rgba(219, 228, 232, 0.42);
        animation: blink 920ms steps(1, end) infinite;
        visibility: hidden;
      }

      .type-cursor.visible {
        visibility: visible;
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0;
        }
      }

      @keyframes liquid-metal {
        0% {
          transform: translate3d(-1.5%, -1%, 0) rotate(0deg) scale(1);
          filter: blur(22px) saturate(0.86) contrast(1.16) hue-rotate(0deg);
        }

        50% {
          transform: translate3d(1.2%, 1.8%, 0) rotate(9deg) scale(1.04);
          filter: blur(26px) saturate(1.02) contrast(1.26) hue-rotate(10deg);
        }

        100% {
          transform: translate3d(1.8%, -1.4%, 0) rotate(-6deg) scale(1.03);
          filter: blur(24px) saturate(0.96) contrast(1.2) hue-rotate(-8deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before {
          animation: none;
        }
      }

      @media (max-width: 700px) {
        body {
          place-items: start center;
        }

        .stage {
          width: 100%;
          min-height: 100vh;
          padding: 0;
        }

        .terminal {
          width: 100%;
          min-height: 100vh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          padding: 14px;
        }

        .terminal::before {
          display: none;
        }

        .screen {
          min-height: calc(100vh - 28px);
          border-radius: 18px;
        }

        .content {
          min-height: calc(100vh - 28px);
          padding: 28px 22px;
        }

        .topline {
          font-size: 11px;
        }

        .brand {
          gap: 10px;
          margin-bottom: 26px;
          font-size: 17px;
        }

        .lockup {
          padding-top: 106px;
        }

        .ag-logo {
          min-width: auto;
          height: auto;
          font-size: 17px;
        }

        .ag-logo::before {
          width: 116px;
          height: 70px;
        }

        h1 {
          font-size: clamp(23px, 6.2vw, 30px);
        }

        .footer {
          align-items: flex-start;
          gap: 8px;
        }

        .action-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 7px;
        }

        .access,
        .download {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="terminal" aria-label="Silver Code teaser terminal">
        <div class="screen">
          <div class="content">
            <div class="lockup">
              <p class="brand">
                <span class="ag-logo" data-mark="[ag]">[ag]</span>
                <span class="brand-name"><span>Silver</span><span>Code</span></span>
              </p>
              <h1 id="typewriter" aria-label="All agents. All accounts. All together. In your terminal.">
                <span class="line" data-text="All agents.">All agents.</span>
                <span class="line" data-text="All accounts.">All accounts.</span>
                <span class="line" data-text="All together.">All together.</span>
                <span class="line" data-text="In your terminal.">In your terminal.</span>
              </h1>
            </div>

            <div class="footer">
              <div class="status">
                <span class="dot" aria-hidden="true"></span>
              </div>
              <div class="action-row">
                <a class="access" href="mailto:bjorn@stabell.org?subject=Request%20Silver%20Code%20beta%20access">REQUEST ACCESS</a>
                <span class="access-note">to closed beta</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      (() => {
      // Default is the public teaser. Use the private hash fragment or set this to "download" for local preview.
      const ACCESS_MODE = "request";
      const ACCESS_TOKEN_SHA256 = "2a6068b51af68cd6d9c4a4eb0a0952e7cc4c98c78796351f79ba2f9befe39a0d";
      const ACCESS_VARIANTS = {
        request: {
          className: "access",
          href: "mailto:bjorn@stabell.org?subject=Request%20Silver%20Code%20beta%20access",
          label: "REQUEST ACCESS",
          note: "to closed beta",
          download: false,
        },
        download: {
          className: "download",
          href: "./silver-code-beta.zip",
          label: "DOWNLOAD",
          note: "private build",
          download: true,
        },
      };

      const title = document.querySelector("#typewriter");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const actionRow = document.querySelector(".action-row");

      void renderAccessAction();

      if (title && !reduceMotion) {
        const lineTexts = Array.from(title.querySelectorAll(".line")).map((line) => line.dataset.text ?? "");
        title.textContent = "";

        const cursor = document.createElement("span");
        cursor.className = "type-cursor";
        cursor.setAttribute("aria-hidden", "true");

        const lines = lineTexts.map(() => {
          const line = document.createElement("span");
          line.className = "line";
          title.append(line);
          return line;
        });
        title.append(cursor);

        const type = async () => {
          await wait(260);
          for (let lineIndex = 0; lineIndex < lineTexts.length; lineIndex += 1) {
            const text = lineTexts[lineIndex];
            const line = lines[lineIndex];
            if (!line) continue;
            for (const char of text) {
              line.textContent += char;
              await wait(char === " " ? 18 : 26);
            }
            await wait(lineIndex === lineTexts.length - 1 ? 0 : 135);
          }
          cursor.classList.add("visible");
        };

        void type();
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      async function renderAccessAction() {
        if (!actionRow) return;

        const mode = await resolveAccessMode();
        const variant = ACCESS_VARIANTS[mode] ?? ACCESS_VARIANTS.request;
        actionRow.textContent = "";

        const link = document.createElement("a");
        link.className = variant.className;
        link.href = variant.href;
        link.textContent = variant.label;
        if (variant.download) {
          link.setAttribute("download", "");
        }

        const note = document.createElement("span");
        note.className = "access-note";
        note.textContent = variant.note;

        actionRow.append(link, note);
      }

      async function resolveAccessMode() {
        if (ACCESS_MODE !== "request") return ACCESS_MODE;

        const token = window.location.hash.replace(/^#\/?/, "").trim();
        if (!token || !window.crypto?.subtle) return "request";

        return (await sha256Hex(token)) === ACCESS_TOKEN_SHA256 ? "download" : "request";
      }

      async function sha256Hex(value) {
        const bytes = new TextEncoder().encode(value);
        const digest = await window.crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
      }
      })();
    </script>
  </body>
</html>
